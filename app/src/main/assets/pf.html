<!doctype html>
<html lang="en" class="js" data-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>xivpf</title>
    <link rel="stylesheet" href="https://xivpf.com/assets/minireset.css">
    <link rel="stylesheet" href="https://xivpf.com/assets/pico.css">
    <link rel="stylesheet" href="https://xivpf.com/assets/common.css">
    <link rel="stylesheet" href="https://xivpf.com/assets/listings.css">
    <style>
        #pf-status { color: var(--meta-text); margin-left: 1em; white-space: nowrap; }
        #pf-categories { display: flex; flex-flow: row wrap; gap: .25em 1em; }
        #pf-categories label { display: inline-flex; align-items: center; gap: .4em; margin: 0; white-space: nowrap; }
        #pf-categories input { margin: 0; }
        .pf-cat-buttons { margin: .5em 0 0 1em; display: flex; gap: .5em; }
        .pf-cat-buttons a { cursor: pointer; }
        #container > .settings > .controls { flex-wrap: wrap; row-gap: .5em; }
        #container > .settings > .controls > select { flex: 0 1 14em; }
        #container > .settings > .controls > a { margin-left: 1em; white-space: nowrap; }
        #container > .settings > .controls > label { display: inline-flex; align-items: center; gap: .4em; margin: 0 0 0 1em; white-space: nowrap; }
        #container > .settings > .controls > label > input { margin: 0; }
        #container > .settings > .controls > label > select { width: auto; margin: 0; padding: .2em 2em .2em .6em; }
    </style>
</head>
<body>
<script src="pf.js"></script>
</body>
</html>
